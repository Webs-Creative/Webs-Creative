<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t d">
  <title id="t">Webs Creative</title>
  <desc id="d">Estudio de desarrollo de software a medida y diseño web profesional.</desc>
  <defs>
    <clipPath id="frame"><rect width="1280" height="520" rx="28"/></clipPath>
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E5762F" stop-opacity=".55"/>
      <stop offset="1" stop-color="#E5762F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B9500F" stop-opacity=".5"/>
      <stop offset="1" stop-color="#B9500F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F5CBA7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#F5CBA7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".35" stop-color="#FDEBDF"/>
      <stop offset=".5" stop-color="#F29052"/>
      <stop offset=".65" stop-color="#FDEBDF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="chipStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5762F" stop-opacity=".9"/>
      <stop offset="1" stop-color="#E5762F" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5762F"/>
      <stop offset=".5" stop-color="#232127"/>
      <stop offset="1" stop-color="#D2601F"/>
    </linearGradient>
    <linearGradient id="fadeFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E0E12" stop-opacity="1"/>
      <stop offset=".45" stop-color="#0E0E12" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF" fill-opacity=".06"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .orb{transform-box:fill-box;transform-origin:center;animation:drift 18s ease-in-out infinite alternate}
    .orb2{animation-duration:23s;animation-direction:alternate-reverse}
    .orb3{animation-duration:15s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-30px) scale(1.15)}100%{transform:translate(-50px,25px) scale(.95)}}
    .grid line{stroke:#E5762F;stroke-opacity:.16;stroke-width:1}
    .hl{animation:floor 6s linear infinite}
    @keyframes floor{0%{transform:translateY(0);stroke-opacity:0}15%{stroke-opacity:.35}100%{transform:translateY(160px);stroke-opacity:.05}}
    .float{animation:float 7s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    .chip{font:600 15px 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#FDEBDF;letter-spacing:.2px}
    .eyebrow{font:700 14px 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#F29052;letter-spacing:5px}
    .h1{font:800 104px 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;letter-spacing:-3px}
    .sub{font:400 22px 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#C4C4CC}
    .sub b{fill:#FFFFFF;font-weight:600}
    .brand{font:700 17px 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#FFFFFF;letter-spacing:.3px}
    .url{font:500 14px 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace;fill:#71717C}
    .pill{font:600 13px 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#FDEBDF;letter-spacing:.4px}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
    .reveal{opacity:0;animation:rise 1s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    .scan{animation:scan 5s ease-in-out infinite}
    @keyframes scan{0%{transform:translateX(-300px)}100%{transform:translateX(1580px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="520" fill="#0E0E12"/>
    <rect width="1280" height="520" fill="url(#dots)"/>
    <circle class="orb" cx="1020" cy="110" r="330" fill="url(#orbA)"/>
    <circle class="orb orb2" cx="210" cy="440" r="300" fill="url(#orbB)"/>
    <circle class="orb orb3" cx="640" cy="40" r="260" fill="url(#orbC)"/>
    <g class="grid">
      <line x1="444.0" y1="360" x2="-1040.0" y2="520"/><line x1="458.0" y1="360" x2="-920.0" y2="520"/><line x1="472.0" y1="360" x2="-800.0" y2="520"/><line x1="486.0" y1="360" x2="-680.0" y2="520"/><line x1="500.0" y1="360" x2="-560.0" y2="520"/><line x1="514.0" y1="360" x2="-440.0" y2="520"/><line x1="528.0" y1="360" x2="-320.0" y2="520"/><line x1="542.0" y1="360" x2="-200.0" y2="520"/><line x1="556.0" y1="360" x2="-80.0" y2="520"/><line x1="570.0" y1="360" x2="40.0" y2="520"/><line x1="584.0" y1="360" x2="160.0" y2="520"/><line x1="598.0" y1="360" x2="280.0" y2="520"/><line x1="612.0" y1="360" x2="400.0" y2="520"/><line x1="626.0" y1="360" x2="520.0" y2="520"/><line x1="640.0" y1="360" x2="640.0" y2="520"/><line x1="654.0" y1="360" x2="760.0" y2="520"/><line x1="668.0" y1="360" x2="880.0" y2="520"/><line x1="682.0" y1="360" x2="1000.0" y2="520"/><line x1="696.0" y1="360" x2="1120.0" y2="520"/><line x1="710.0" y1="360" x2="1240.0" y2="520"/><line x1="724.0" y1="360" x2="1360.0" y2="520"/><line x1="738.0" y1="360" x2="1480.0" y2="520"/><line x1="752.0" y1="360" x2="1600.0" y2="520"/><line x1="766.0" y1="360" x2="1720.0" y2="520"/><line x1="780.0" y1="360" x2="1840.0" y2="520"/><line x1="794.0" y1="360" x2="1960.0" y2="520"/><line x1="808.0" y1="360" x2="2080.0" y2="520"/><line x1="822.0" y1="360" x2="2200.0" y2="520"/><line x1="836.0" y1="360" x2="2320.0" y2="520"/>
      <line class="hl" style="animation-delay:-0.00s" x1="0" y1="360" x2="1280" y2="360"/><line class="hl" style="animation-delay:-0.75s" x1="0" y1="360" x2="1280" y2="360"/><line class="hl" style="animation-delay:-1.50s" x1="0" y1="360" x2="1280" y2="360"/><line class="hl" style="animation-delay:-2.25s" x1="0" y1="360" x2="1280" y2="360"/><line class="hl" style="animation-delay:-3.00s" x1="0" y1="360" x2="1280" y2="360"/><line class="hl" style="animation-delay:-3.75s" x1="0" y1="360" x2="1280" y2="360"/><line class="hl" style="animation-delay:-4.50s" x1="0" y1="360" x2="1280" y2="360"/><line class="hl" style="animation-delay:-5.25s" x1="0" y1="360" x2="1280" y2="360"/>
    </g>
    <rect y="358" width="1280" height="162" fill="url(#fadeFloor)"/>
    <rect class="scan" x="0" y="0" width="220" height="520" fill="#FFFFFF" fill-opacity=".025" transform="skewX(-20)"/>
    <!-- top bar -->
    <g transform="translate(48 40)">
      <rect width="44" height="44" rx="12" fill="#E5762F"/>
      <text x="22" y="29.5" text-anchor="middle" style="font:800 18px 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#FFFFFF;letter-spacing:-.5px">WC</text>
      <text x="58" y="20" class="brand">Webs Creative</text>
      <text x="58" y="38" class="url">webscreative.es</text>
    </g>
    <g transform="translate(942 44)">
      <rect width="290" height="36" rx="18" fill="#121216" fill-opacity=".85" stroke="#232127"/>
      <circle class="pulse" cx="22" cy="18" r="5" fill="#25D366"/>
      <circle cx="22" cy="18" r="5" fill="#25D366"/>
      <text x="38" y="23" class="pill">Aceptando proyectos · 2026</text>
    </g>
  <g class="float" style="animation-delay:-0s">
    <rect x="120" y="132" width="164" height="38" rx="19" fill="#121216" fill-opacity=".82" stroke="url(#chipStroke)"/>
    <text x="202" y="156.5" text-anchor="middle" class="chip">&lt;/&gt;  CRM a medida</text>
  </g>
  <g class="float" style="animation-delay:-1.2s">
    <rect x="1010" y="120" width="199" height="38" rx="19" fill="#121216" fill-opacity=".82" stroke="url(#chipStroke)"/>
    <text x="1109" y="144.5" text-anchor="middle" class="chip">✦  Agentes de IA 24/7</text>
  </g>
  <g class="float" style="animation-delay:-2.1s">
    <rect x="150" y="400" width="164" height="38" rx="19" fill="#121216" fill-opacity=".82" stroke="url(#chipStroke)"/>
    <text x="232" y="424.5" text-anchor="middle" class="chip">VERI*FACTU · 2027</text>
  </g>
  <g class="float" style="animation-delay:-0.6s">
    <rect x="960" y="404" width="181" height="38" rx="19" fill="#121216" fill-opacity=".82" stroke="url(#chipStroke)"/>
    <text x="1051" y="428.5" text-anchor="middle" class="chip">⏱  Fichajes por ley</text>
  </g>
    <!-- headline -->
    <g text-anchor="middle">
      <text x="640.0" y="178" class="eyebrow reveal" style="animation-delay:.1s">SOFTWARE A MEDIDA · DISEÑO WEB · IA</text>
      <text x="640.0" y="282" class="h1 reveal" fill="url(#title)" filter="url(#glow)" style="animation-delay:.3s">Webs Creative</text>
      <text x="640.0" y="336" class="sub reveal" style="animation-delay:.55s">Diseñamos, desarrollamos y programamos <tspan font-weight="600" fill="#FFFFFF">activos digitales que venden.</tspan></text>
    </g>
    <g class="reveal" style="animation-delay:.8s">
      <rect x="600.0" y="362" width="80" height="4" rx="2" fill="#E5762F"/>
    </g>
  </g>
  <rect x=".75" y=".75" width="1278.5" height="518.5" rx="27.5" fill="none" stroke="url(#border)" stroke-opacity=".7" stroke-width="1.5"/>
</svg>
