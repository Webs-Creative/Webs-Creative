<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="¿Hablamos de tu proyecto? Pide presupuesto sin compromiso en webscreative.es/contacto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9500F"/><stop offset=".55" stop-color="#E5762F"/><stop offset="1" stop-color="#F29052"/>
    </linearGradient>
    <clipPath id="c"><rect width="1280" height="300" rx="28"/></clipPath>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#FFFFFF" fill-opacity=".14"/></pattern>
  </defs>
  <style>
    .k{font:700 15px 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace;fill:#0E0E12;fill-opacity:.7;letter-spacing:3px}
    .h{font:800 58px 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#FFFFFF;letter-spacing:-1.8px}
    .s{font:500 20px 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#FDEBDF}
    .b{font:700 19px 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#FFFFFF}
    .ring{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
    .ring2{animation-duration:60s;animation-direction:reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .btn{animation:nudge 2.4s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1280" height="300" fill="url(#bg)"/>
    <rect width="1280" height="300" fill="url(#dots)"/>
    <g class="ring" fill="none" stroke="#FFFFFF" stroke-opacity=".18">
      <circle cx="1120" cy="150" r="200" stroke-dasharray="4 14" stroke-width="2"/>
    </g>
    <g class="ring ring2" fill="none" stroke="#0E0E12" stroke-opacity=".2">
      <circle cx="1120" cy="150" r="140" stroke-dasharray="60 30" stroke-width="10"/>
    </g>
    <circle cx="1120" cy="150" r="78" fill="#0E0E12" fill-opacity=".92"/>
    <g transform="translate(1120 156) scale(.13)" fill="none">
  <defs><mask id="cmo" maskUnits="userSpaceOnUse" x="-500" y="-500" width="1000" height="1000"><rect x="-500" y="-500" width="1000" height="1000" fill="#fff"/><rect x="-88" y="-500" width="176" height="400" fill="#000"/></mask><mask id="cmf" maskUnits="userSpaceOnUse" x="-500" y="-500" width="1000" height="1000"><rect x="-500" y="-500" width="1000" height="1000" fill="#fff"/><rect x="-110" y="-500" width="220" height="400" fill="#000"/></mask></defs>
  <circle r="300" stroke="#FFFFFF" stroke-width="100" mask="url(#cmo)"/>
  <circle r="300" stroke="#0E0E12" stroke-width="54" mask="url(#cmf)"/>
  <path d="M132.0 -269.4 A300 300 0 1 1 -132.0 -269.4" stroke="#E5762F" stroke-width="13" stroke-linecap="round"/>
  <line y1="-352" y2="10" stroke="#FFFFFF" stroke-width="140" stroke-linecap="round"/>
  <line y1="-352" y2="10" stroke="#0E0E12" stroke-width="92" stroke-linecap="round"/>
  <line y1="-342" y2="0" stroke="#E5762F" stroke-width="22" stroke-linecap="round"/>
</g>
  </g>
  <text x="64" y="78" class="k">// NUEVO PROYECTO</text>
  <text x="64" y="146" class="h">¿Hablamos de tu proyecto?</text>
  <text x="64" y="186" class="s">Cuéntanos tu idea y te enviamos una propuesta clara, sin compromiso.</text>
  <g class="btn">
    <rect x="64" y="214" width="300" height="54" rx="27" fill="#0E0E12"/>
    <text x="96" y="248" class="b">Pedir presupuesto  <tspan fill="#E5762F">→</tspan></text>
  </g>
</svg>
