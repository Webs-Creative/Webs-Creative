<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-label="Cómo trabajamos: escuchamos, diseñamos, desarrollamos y acompañamos.">
  <defs>
    <linearGradient id="p" x1="0" x2="1"><stop offset="0" stop-color="#B9500F"/><stop offset="1" stop-color="#F29052"/></linearGradient>
  </defs>
  <style>
    .num{font:800 22px 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#FFFFFF}
    .t{font:700 24px 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#FFFFFF}
    .d{font:400 18px 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#C4C4CC}
    .prog{stroke-dasharray:960;stroke-dashoffset:960;animation:prog 3.6s cubic-bezier(.6,0,.2,1) .2s infinite}
    @keyframes prog{0%{stroke-dashoffset:960}75%,100%{stroke-dashoffset:0}}
    .ring{opacity:0;animation:ring 3.6s ease-out infinite}
    @keyframes ring{0%,5%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect x=".75" y=".75" width="1278.5" height="248.5" rx="22" fill="#121216" stroke="#232127" stroke-width="1.5"/>
  <line x1="160" y1="78" x2="1120" y2="78" stroke="#232127" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <line class="prog" x1="160" y1="78" x2="1120" y2="78" stroke="url(#p)" stroke-width="3" stroke-linecap="round"/>
    <g class="node" style="animation-delay:0.0s">
      <circle cx="160" cy="78" r="34" fill="#0E0E12" stroke="#232127" stroke-width="2"/>
      <circle cx="160" cy="78" r="34" fill="none" stroke="#E5762F" stroke-width="2" class="ring" style="animation-delay:0.0s"/>
      <text x="160" y="86" text-anchor="middle" class="num">01</text>
      <text x="160" y="148" text-anchor="middle" class="t">Escuchamos</text>
      <text x="160" y="182" text-anchor="middle" class="d">Analizamos tu negocio</text>
      <text x="160" y="208" text-anchor="middle" class="d">y lo que necesitas</text>
    </g>
    <g class="node" style="animation-delay:0.9s">
      <circle cx="480" cy="78" r="34" fill="#0E0E12" stroke="#232127" stroke-width="2"/>
      <circle cx="480" cy="78" r="34" fill="none" stroke="#E5762F" stroke-width="2" class="ring" style="animation-delay:0.9s"/>
      <text x="480" y="86" text-anchor="middle" class="num">02</text>
      <text x="480" y="148" text-anchor="middle" class="t">Diseñamos</text>
      <text x="480" y="182" text-anchor="middle" class="d">Propuesta clara, sin</text>
      <text x="480" y="208" text-anchor="middle" class="d">letra pequeña</text>
    </g>
    <g class="node" style="animation-delay:1.8s">
      <circle cx="800" cy="78" r="34" fill="#0E0E12" stroke="#232127" stroke-width="2"/>
      <circle cx="800" cy="78" r="34" fill="none" stroke="#E5762F" stroke-width="2" class="ring" style="animation-delay:1.8s"/>
      <text x="800" y="86" text-anchor="middle" class="num">03</text>
      <text x="800" y="148" text-anchor="middle" class="t">Desarrollamos</text>
      <text x="800" y="182" text-anchor="middle" class="d">Código a medida, con</text>
      <text x="800" y="208" text-anchor="middle" class="d">entregas visibles</text>
    </g>
    <g class="node" style="animation-delay:2.7s">
      <circle cx="1120" cy="78" r="34" fill="#0E0E12" stroke="#232127" stroke-width="2"/>
      <circle cx="1120" cy="78" r="34" fill="none" stroke="#E5762F" stroke-width="2" class="ring" style="animation-delay:2.7s"/>
      <text x="1120" y="86" text-anchor="middle" class="num">04</text>
      <text x="1120" y="148" text-anchor="middle" class="t">Acompañamos</text>
      <text x="1120" y="182" text-anchor="middle" class="d">Soporte y mejoras</text>
      <text x="1120" y="208" text-anchor="middle" class="d">del mismo equipo</text>
    </g>
</svg>
