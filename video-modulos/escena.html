<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Módulos Webs Creative</title>
<!--
  Vídeo promocional de los módulos para Dolibarr de Webs Creative.
  Cada fotograma se pinta con pintar(t): render.mjs lo llama 30 veces por
  segundo y lo graba. Abierto a mano en el navegador, se reproduce solo
  (clic para pausar, flechas para moverse).
  Los tiempos de cada escena vienen de tiempos.js, que escribe tiempos.py.
-->
<style>
@font-face{font-family:"WC Display";src:url("fuentes/InterDisplay-Black.otf") format("opentype");font-weight:900}
@font-face{font-family:"WC Display";src:url("fuentes/InterDisplay-ExtraBold.otf") format("opentype");font-weight:800}
@font-face{font-family:"WC Display";src:url("fuentes/InterDisplay-SemiBold.otf") format("opentype");font-weight:600}
@font-face{font-family:"WC Mono";src:url("fuentes/jetbrains-mono-latin-500-normal.woff2") format("woff2");font-weight:500}
@font-face{font-family:"WC Mono";src:url("fuentes/jetbrains-mono-latin-700-normal.woff2") format("woff2");font-weight:700}

:root{
  --naranja:#E5762F; --naranja-claro:#F29052; --naranja-vivo:#FF8B3D; --naranja-oscuro:#B9500F;
  --fondo:#09090C; --tinta:#F5F5F7; --gris:#A1A1AA;
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;overflow:hidden}
#marco{width:1080px;height:1920px;transform-origin:0 0}
#escenario{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--fondo);
  font-family:"WC Display",sans-serif;color:var(--tinta)}
.capa{position:absolute;inset:0;pointer-events:none}
.mono{font-family:"WC Mono",monospace}
svg{overflow:visible}
.trazo{fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---------- fondo ---------- */
#puntos{background-image:radial-gradient(circle,rgba(255,255,255,.07) 1.5px,transparent 1.9px);background-size:34px 34px}
.orbe{position:absolute;width:1400px;height:1400px;left:0;top:0;border-radius:50%;mix-blend-mode:screen}
#orbeA{background:radial-gradient(circle,rgba(229,118,47,.50),rgba(229,118,47,0) 62%)}
#orbeB{background:radial-gradient(circle,rgba(185,80,15,.55),rgba(185,80,15,0) 62%)}
#orbeC{background:radial-gradient(circle,rgba(245,203,167,.16),rgba(245,203,167,0) 60%)}
#suelo{position:absolute;left:0;top:1240px;width:1080px;height:680px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 55%);mask-image:linear-gradient(to bottom,transparent 0,#000 55%)}
#suelo line{stroke:#E5762F;stroke-width:1.5}
#grano{position:absolute;left:-128px;top:-128px;width:1336px;height:2176px;opacity:.09;mix-blend-mode:overlay;
  background-size:256px 256px}
#vineta{background:radial-gradient(ellipse 80% 62% at 50% 46%,transparent 48%,rgba(0,0,0,.74) 100%)}

/* ---------- gancho ---------- */
.fila{position:absolute;left:0;white-space:nowrap;font:500 38px "WC Mono",monospace;color:rgba(255,255,255,.06);letter-spacing:.02em}
.palabra{position:absolute;left:0;right:0;text-align:center;font-weight:900;letter-spacing:-.035em;line-height:1;opacity:0}
.palabra span{display:inline-block}
#modoManual{position:absolute;top:470px;left:0;right:0;text-align:center;font:700 30px "WC Mono",monospace;color:#6B6B75;letter-spacing:.3em}
#modoManual b{display:inline-block;width:18px;height:18px;border-radius:50%;background:#E5483A;margin-right:16px;vertical-align:2px}

/* ---------- botón de encendido ---------- */
.boton{position:absolute}
.boton .fuera{stroke:#FFFFFF;stroke-width:8}
.boton .medio{stroke:#141014;stroke-width:5}
.boton .nucleo{stroke:#FF8B3D;stroke-width:1.9}
#textoEnciende{position:absolute;top:1060px;left:0;right:0;text-align:center;font-weight:900;font-size:164px;letter-spacing:-.04em;line-height:1}
#textoEnciende span{display:inline-block;background:linear-gradient(180deg,#FFFFFF 30%,#FFD2B0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#conLos{position:absolute;top:1262px;left:0;right:0;text-align:center;font:700 34px "WC Mono",monospace;letter-spacing:.32em;color:var(--gris)}
#marcaEnciende{position:absolute;top:1316px;left:0;right:0;text-align:center;font-weight:900;font-size:104px;letter-spacing:-.03em;line-height:1}

/* ---------- cabecera y progreso ---------- */
#cabecera{position:absolute;top:196px;left:80px;right:80px;height:60px}
#cabecera .logo{position:absolute;left:0;top:0;display:flex;align-items:center;gap:16px;font-weight:800;font-size:34px;letter-spacing:.04em}
#cabecera .logo em{font-style:normal;color:var(--naranja)}
#contador{position:absolute;right:0;top:8px;font:700 34px "WC Mono",monospace;color:#fff;overflow:hidden;height:44px}
#contador i{font-style:normal;color:#6B6B75}
#contador span{display:inline-block}
#progreso{position:absolute;top:286px;left:80px;right:80px;height:8px;display:flex;gap:8px}
#progreso div{flex:1;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
#progreso div b{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF8B3D,#E5762F);box-shadow:0 0 12px rgba(255,139,61,.9)}

/* ---------- módulos ---------- */
.escena{position:absolute;inset:0;display:none}
.gigante{position:absolute;left:540px;top:690px;width:1150px;height:1150px;margin:-575px 0 0 -575px;opacity:.05}
.gigante svg{width:100%;height:100%}
.gigante .trazo{stroke:#E5762F;stroke-width:1.2}
.onda{position:absolute;left:540px;top:690px;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:96px;border:3px solid #FF8B3D;opacity:0}
.contenido{position:absolute;inset:0;transform-origin:540px 900px}
.categoria-fila{position:absolute;top:420px;left:0;right:0;text-align:center}
.categoria{display:inline-flex;align-items:center;gap:16px;padding:14px 30px;border-radius:999px;
  border:2px solid rgba(229,118,47,.55);background:rgba(229,118,47,.10);
  font:700 27px "WC Mono",monospace;letter-spacing:.2em;color:var(--naranja-claro)}
.categoria i{width:12px;height:12px;border-radius:50%;background:#FF8B3D;box-shadow:0 0 14px #FF8B3D}
.baldosa{position:absolute;left:370px;top:520px;width:340px;height:340px;border-radius:84px;
  background:linear-gradient(155deg,#25212A 0%,#121116 55%,#0B0B0E 100%);
  border:2px solid rgba(229,118,47,.6);
  display:flex;align-items:center;justify-content:center}
.baldosa::after{content:"";position:absolute;inset:10px;border-radius:74px;border:1px solid rgba(255,255,255,.06)}
.baldosa svg{width:196px;height:196px}
.baldosa .trazo{stroke-width:3.3}
.columna{position:absolute;top:908px;left:60px;right:60px;display:flex;flex-direction:column;align-items:center}
.nombre-marco{overflow:hidden;padding:0 20px 8px;margin-bottom:-8px}
.nombre{font-weight:900;letter-spacing:-.045em;line-height:1.02;white-space:nowrap;
  background:linear-gradient(180deg,#FFFFFF 40%,#E7E2DE 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sufijo{margin-top:14px;font-weight:800;font-size:46px;letter-spacing:.42em;padding-left:.42em;color:var(--naranja);white-space:nowrap}
.lema{margin-top:40px;max-width:900px;text-align:center;text-wrap:balance;font-weight:600;font-size:54px;line-height:1.16;letter-spacing:-.015em;color:#ECECF0}
.chips{margin-top:46px;display:flex;flex-wrap:wrap;justify-content:center;gap:18px 18px;max-width:960px}
.chip{display:inline-flex;align-items:center;gap:14px;padding:16px 26px;border-radius:20px;
  background:rgba(255,255,255,.055);border:1.5px solid rgba(255,255,255,.13);
  font:500 30px "WC Mono",monospace;color:#D9D9DE;white-space:nowrap}
.chip svg{width:26px;height:26px;flex:none}
.chip .trazo{stroke:#FF8B3D;stroke-width:4}

/* ---------- 17 módulos ---------- */
#tituloDiecisiete{position:absolute;top:388px;left:0;right:0;text-align:center;white-space:nowrap;line-height:1}
#tituloDiecisiete .numero{display:inline-block;font-weight:900;font-size:250px;letter-spacing:-.05em;color:var(--naranja-vivo);
  text-shadow:0 0 60px rgba(255,139,61,.45);min-width:290px;text-align:right}
#tituloDiecisiete .palabraModulos{display:inline-block;font-weight:900;font-size:110px;letter-spacing:-.03em;margin-left:22px;vertical-align:28px}
#rejilla{position:absolute;top:700px;left:105px;width:870px;height:690px}
.mini{position:absolute;width:150px;height:150px;border-radius:40px;background:linear-gradient(155deg,#25212A,#0E0D11);
  border:2px solid rgba(229,118,47,.55);display:flex;align-items:center;justify-content:center}
.mini svg{width:84px;height:84px}
.mini .trazo{stroke-width:3.6}
#ceroManual{position:absolute;top:1450px;left:0;right:0;text-align:center;font-weight:900;font-size:86px;letter-spacing:-.03em;line-height:1}
#ceroManual em{font-style:normal;color:var(--naranja-vivo)}

/* ---------- marca ---------- */
#marcaWebs,#marcaCreative{position:absolute;left:0;right:0;text-align:center;font-weight:900;font-size:176px;letter-spacing:-.035em;line-height:1}
#marcaWebs{top:880px}
#marcaCreative{top:1052px;color:var(--naranja)}
#marcaWebs span,#marcaCreative span{display:inline-block}
#marcaLema{position:absolute;top:1262px;left:0;right:0;text-align:center;font-weight:800;font-size:62px;letter-spacing:-.01em}
#marcaBoton{position:absolute;top:1380px;left:0;right:0;text-align:center}
#marcaBoton span{display:inline-block;position:relative;overflow:hidden;padding:30px 64px;border-radius:999px;
  background:linear-gradient(180deg,#FF9A52,#E5762F);color:#140B05;font-weight:900;font-size:66px;letter-spacing:-.02em;
  box-shadow:0 0 0 2px rgba(255,255,255,.18) inset,0 20px 60px rgba(229,118,47,.5)}
#marcaBoton i{position:absolute;top:-20%;bottom:-20%;width:120px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg)}
#marcaWhats{position:absolute;top:1560px;left:0;right:0;text-align:center;font:500 38px "WC Mono",monospace;color:#C9C9CF;letter-spacing:.06em}
#marcaWhats b{display:inline-block;width:16px;height:16px;border-radius:50%;background:#25D366;margin-right:16px;vertical-align:3px;box-shadow:0 0 14px #25D366}

/* ---------- efectos ---------- */
#destello{background:radial-gradient(circle at 50% 38%,rgba(255,255,255,1) 0%,rgba(255,180,120,.85) 22%,rgba(229,118,47,.35) 45%,rgba(229,118,47,0) 70%);opacity:0;mix-blend-mode:screen}
#raya{position:absolute;top:-200px;width:260px;height:2320px;left:0;opacity:0;
  background:linear-gradient(90deg,rgba(255,139,61,0),rgba(255,170,110,.55) 45%,rgba(255,255,255,.75) 50%,rgba(255,170,110,.55) 55%,rgba(255,139,61,0));
  transform-origin:50% 50%;mix-blend-mode:screen;filter:blur(6px)}
#aviso{position:fixed;left:12px;bottom:12px;font:12px "WC Mono",monospace;color:#888}
</style>
<script src="tiempos.js"></script>
</head>

function iconoNexus(){
  let s = '<circle cx="32" cy="32" r="7"/>';
  for (let k = 0; k < 6; k++){
    const a = (k * 60 - 90) * Math.PI / 180, c = Math.cos(a), n = Math.sin(a);
    const f = v => v.toFixed(2);
    s += `<path d="M${f(32+10*c)} ${f(32+10*n)}L${f(32+18*c)} ${f(32+18*n)}"/><circle cx="${f(32+22.5*c)}" cy="${f(32+22.5*n)}" r="4.5"/>`;
  }
  return s;
}

const CHECK = '<path d="M5 13.5l5.5 5.5L21 7"/>';

/* ================= utilidades ================= */

const T = window.TIEMPOS;
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: x => x,
  outCubic: x => 1 - (1 - x) ** 3,
  inCubic: x => x ** 3,
  inOutCubic: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  outExpo: x => x >= 1 ? 1 : 1 - 2 ** (-10 * x),
  outQuint: x => 1 - (1 - x) ** 5,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; },
};
// avance de 0 a 1 entre a y a+d, con curva
const av = (t, a, d, e = E.outCubic) => e(clamp((t - a) / d));
// golpe: sube de golpe en t0 y se apaga en d segundos
const golpe = (t, t0, d) => (t < t0 || t > t0 + d * 2) ? 0 : Math.exp(-4 * (t - t0) / d);
function azar(semilla){
  let a = semilla >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
}
const esc = Object.fromEntries(T.escenas.map(e => [e.id, e]));
// momento en que la voz dice un trozo del texto de una escena (reparto por letras)
function momento(id, trozo){
  const e = esc[id], i = Math.max(0, e.texto.indexOf(trozo));
  return e.vozIni + (e.vozFin - e.vozIni) * i / e.texto.length;
}
function icono(svgMarcado){
  return `<svg viewBox="0 0 64 64"><g class="trazo">${svgMarcado}</g></svg>`;
}
// cada trazo con longitud 1 para poder dibujarlo de 0 a 1
function preparaTrazos(raiz){
  raiz.querySelectorAll("path,circle,rect").forEach(el => {
    el.setAttribute("pathLength", "1");
    el.style.strokeDasharray = "1 1.001";
  });
}
function dibuja(raiz, k){
  raiz.__trazos = raiz.__trazos || raiz.querySelectorAll("path,circle,rect");
  // con k = 0 el trazo redondeado aún dejaría un punto: se esconde del todo
  raiz.__trazos.forEach(el => {
    el.style.strokeDashoffset = String(1 - k);
    el.style.visibility = k > 0.002 ? "visible" : "hidden";
  });
}
function mezclaColor(a, b, k){
  const h = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const x = h(a), y = h(b);
  return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], k))).join(",")})`;
}
function boton(svgPadre){
  svgPadre.innerHTML = ["fuera", "medio", "nucleo"].map(c => `<g class="trazo ${c}">${ENCENDIDO}</g>`).join("");
  preparaTrazos(svgPadre);
  return {
    fuera: svgPadre.querySelector(".fuera"), medio: svgPadre.querySelector(".medio"), nucleo: svgPadre.querySelector(".nucleo"),
  };
}
function vis(el, si){ el.style.display = si ? "block" : "none"; }

/* ================= pintar ================= */

const VENTANA = {gancho: [0, 0.45], encender: [0, 0.05], diecisiete: [0.1, 0.05], marca: [0.05, 0]};

function visible(id, t){
  const e = esc[id], [antes, despues] = VENTANA[id] || [0.15, 0.05];
  return t >= e.ini - antes && t < e.fin + despues;
}

function pintarFondo(t, luz){
  const ox = 700, oy = 700;
  const orbes = [
    ["#orbeA", 540 + 280 * Math.sin(t * .23), 760 + 240 * Math.cos(t * .17), .95],
    ["#orbeB", 260 + 240 * Math.sin(t * .19 + 2), 1450 + 200 * Math.sin(t * .21), .9],
    ["#orbeC", 840 + 200 * Math.cos(t * .27), 380 + 160 * Math.sin(t * .31), 1],
  ];
  orbes.forEach(([s, x, y, o]) => {
    const el = $(s);
    el.style.transform = `translate(${x - ox}px,${y - oy}px)`;
    el.style.opacity = (o * luz).toFixed(3);
  });
  $("#suelo").style.opacity = (0.5 * luz).toFixed(3);
  const n = capas.lineasH.length, fase = (t * 0.55) % 1;
  capas.lineasH.forEach((l, k) => {
    const d = (k + fase) / n, y = 680 * d ** 2.1;
    l.setAttribute("y1", y.toFixed(1));
    l.setAttribute("y2", y.toFixed(1));
    l.setAttribute("opacity", (0.15 + 0.7 * d).toFixed(2));
  });
  const filasVisibles = t < T.flash + 0.6;
  vis($("#filas"), filasVisibles);
  if (filasVisibles){
    $("#filas").style.opacity = (1 - av(t, T.flash - 0.05, 0.3)).toFixed(3);
    capas.filas.forEach((f, k) => {
      const v = (k % 2 ? 1 : -1) * (70 + (k % 5) * 12);
      f.style.transform = `translateX(${((t * v) % 1100) - 1100}px)`;
    });
  }
}

function pintarGancho(t){
  const e = esc.gancho, sale = av(t, e.fin + 0.1, 0.3, E.inCubic);
  $("#modoManual").style.opacity = ((0.4 + 0.6 * (Math.floor(t * 2.2) % 2)) * (1 - av(t, capas.gancho[0].t0, 0.2))).toFixed(2);
  capas.gancho.forEach((p, k) => {
    const a = av(t, p.t0, 0.22, E.outExpo);
    const sacude = p.grande ? golpe(t, p.t0, 0.5) * 22 : 0;
    const r = azar(Math.floor(t * 60) + k * 99);
    const escala = lerp(1.7, 1, a) * lerp(1, 0.6, sale);
    p.el.style.opacity = (a * (1 - sale)).toFixed(3);
    p.el.style.filter = `blur(${((1 - a) * 14 + sale * 16).toFixed(1)}px)`;
    p.span.style.transform = `translate(${((r() - .5) * sacude).toFixed(1)}px,${((r() - .5) * sacude + sale * (k - 1.5) * -60).toFixed(1)}px) scale(${escala.toFixed(3)})`;
  });
}

function pintarBoton(b, dibujo, luz, nucleo){
  dibuja(b.fuera, dibujo);
  dibuja(b.medio, dibujo);
  dibuja(b.nucleo, nucleo);
  b.fuera.style.stroke = mezclaColor("#4A4A52", "#FFFFFF", luz);
  b.svg.style.filter = luz > 0.01
    ? `drop-shadow(0 0 ${(10 + 30 * luz).toFixed(1)}px rgba(255,139,61,${(0.9 * luz).toFixed(2)}))`
    : "none";
}

function pintarEncender(t){
  const e = esc.encender, u = t - e.ini, D = e.fin - e.ini, b = capas.botonE;
  const aparece = av(u, 0.15, 0.32, E.outBack);
  const pulsa = av(t, T.flash - 0.2, 0.18, E.inOutCubic) * (1 - av(t, T.flash, 0.25, E.outBack));
  const luz = av(t, T.flash, 0.25);
  const sale = av(u, D - 0.34, 0.34, E.inCubic);
  const escala = lerp(0.6, 1, aparece) * (1 - 0.12 * pulsa) * (1 + 0.05 * golpe(t, T.flash, 0.4));
  const sube = av(t, momento("encender", "Con") - 0.1, 0.5, E.inOutCubic);
  b.svg.style.opacity = clamp(aparece * 2).toFixed(3);
  b.svg.style.transform = `translateY(${(-60 * sube).toFixed(1)}px) scale(${(escala * lerp(1, 0.86, sube)).toFixed(3)})`;
  pintarBoton(b, 1, luz, av(t, T.flash, 0.45, E.inOutCubic));
  ["#ondaE1", "#ondaE2"].forEach((s, k) => {
    const o = av(t, T.flash + k * 0.12, 0.9, E.outCubic), el = $(s);
    el.style.top = "680px";
    el.style.borderRadius = "50%";
    el.style.opacity = (t > T.flash ? (1 - o) * 0.7 : 0).toFixed(3);
    el.style.transform = `scale(${lerp(1.2, 4.2, o).toFixed(3)})`;
  });
  const enc = av(t, T.flash + 0.02, 0.25, E.outExpo);
  const tx = $("#textoEnciende");
  tx.style.opacity = enc.toFixed(3);
  tx.style.transform = `translateY(${(-40 * sube).toFixed(1)}px) scale(${lerp(1.6, 1, enc).toFixed(3)})`;
  tx.style.filter = `blur(${((1 - enc) * 12).toFixed(1)}px)`;
  const con = av(t, momento("encender", "Con") - 0.05, 0.35);
  $("#conLos").style.opacity = con.toFixed(3);
  $("#conLos").style.transform = `translateY(${((1 - con) * 30 - 40 * sube).toFixed(1)}px)`;
  const marca = av(t, momento("encender", "Webs") - 0.08, 0.3, E.outExpo);
  const me = $("#marcaEnciende");
  me.style.opacity = marca.toFixed(3);
  me.style.transform = `translateY(${(-40 * sube).toFixed(1)}px) scale(${lerp(1.4, 1, marca).toFixed(3)})`;
  me.style.filter = `blur(${((1 - marca) * 10).toFixed(1)}px)`;
  const el = $("#encender");
  el.style.transform = `scale(${lerp(1, 1.7, sale).toFixed(3)})`;
  el.style.opacity = (1 - sale).toFixed(3);
  el.style.filter = sale > 0.01 ? `blur(${(sale * 18).toFixed(1)}px)` : "none";
}

function pintarModulo(c, t){
  const e = c.e, u = t - e.ini, D = e.fin - e.ini;
  const sale = av(u, D - 0.28, 0.28, E.inCubic);
  const enciende = 0.45;
  // escena entera: zoom lento y salida hacia arriba
  c.contenido.style.transform = `translateY(${(-110 * sale).toFixed(1)}px) scale(${(1 + 0.03 * clamp(u / D)).toFixed(4)})`;
  c.contenido.style.opacity = (1 - sale).toFixed(3);
  c.contenido.style.filter = sale > 0.01 ? `blur(${(sale * 12).toFixed(1)}px)` : "none";
  // categoría
  const cat = av(u, 0.04, 0.3);
  c.categoria.style.opacity = cat.toFixed(3);
  c.categoria.style.transform = `translateY(${((1 - cat) * 34).toFixed(1)}px)`;
  // baldosa e icono
  const entra = av(u, 0, 0.42, E.outBack);
  const luz = av(u, enciende, 0.14);
  const pulso = golpe(u, enciende, 0.7);
  c.baldosa.style.opacity = clamp(u / 0.12).toFixed(3);
  c.baldosa.style.transform = `translateY(${(Math.sin(u * 2.3) * 7).toFixed(1)}px) rotate(${((1 - entra) * -12).toFixed(2)}deg) scale(${(lerp(0.5, 1, entra) * (1 + 0.06 * pulso)).toFixed(3)})`;
  c.baldosa.style.boxShadow = `0 40px 90px rgba(0,0,0,.6), 0 0 ${(40 + 120 * pulso + 30 * luz).toFixed(0)}px rgba(255,139,61,${(0.25 * luz + 0.5 * pulso).toFixed(2)})`;
  dibuja(c.icono, av(u, 0.1, 0.5, E.inOutCubic));
  c.iconoG.style.stroke = mezclaColor("#6B6B75", "#FF8B3D", luz);
  c.icono.style.filter = luz > 0.01 ? `drop-shadow(0 0 ${(6 + 16 * luz + 20 * pulso).toFixed(1)}px rgba(255,139,61,${(0.85 * luz).toFixed(2)}))` : "none";
  // icono gigante del fondo
  c.gigante.style.transform = `rotate(${(u * 4 - 6).toFixed(2)}deg) scale(${(0.9 + 0.08 * av(u, 0, 1.2)).toFixed(3)})`;
  c.gigante.style.opacity = (0.055 * av(u, 0.2, 0.6) * (1 - sale)).toFixed(3);
  // ondas al encenderse
  c.ondas.forEach((o, k) => {
    const a = av(u, enciende + k * 0.13, 0.9, E.outCubic);
    o.style.opacity = (u > enciende + k * 0.13 ? (1 - a) * 0.65 * (1 - sale) : 0).toFixed(3);
    o.style.transform = `scale(${lerp(1, 2.6, a).toFixed(3)})`;
  });
  // nombre
  const nom = av(u, 0.1, 0.5, E.outExpo);
  c.nombre.style.transform = `translateY(${((1 - nom) * 110).toFixed(1)}%)`;
  const suf = av(u, 0.26, 0.5);
  c.sufijo.style.opacity = suf.toFixed(3);
  c.sufijo.style.letterSpacing = lerp(0.9, 0.42, suf).toFixed(3) + "em";
  const lema = av(u, 0.36, 0.4);
  c.lema.style.opacity = lema.toFixed(3);
  c.lema.style.transform = `translateY(${((1 - lema) * 26).toFixed(1)}px)`;
  c.chips.forEach((ch, k) => {
    const a = av(u, 0.62 + k * 0.14, 0.32, E.outBack);
    ch.style.opacity = clamp(a * 1.5).toFixed(3);
    ch.style.transform = `translateY(${((1 - a) * 20).toFixed(1)}px) scale(${lerp(0.7, 1, a).toFixed(3)})`;
  });
}

function pintarDiecisiete(t){
  const e = esc.diecisiete, u = t - e.ini, D = e.fin - e.ini;
  const sale = av(u, D - 0.38, 0.38, E.inCubic);
  const titulo = av(u, 0, 0.35, E.outExpo);
  const tit = $("#tituloDiecisiete");
  tit.style.opacity = (titulo * (1 - sale)).toFixed(3);
  tit.style.transform = `scale(${(lerp(1.4, 1, titulo) * lerp(1, 0.8, sale)).toFixed(3)})`;
  const ultimo = 0.08 + 16 * 0.055;
  $("#tituloDiecisiete .numero").textContent = String(Math.round(17 * av(u, 0.05, ultimo, E.lin)));
  capas.minis.forEach((mi, j) => {
    const t0 = 0.08 + j * 0.055;
    const a = av(u, t0, 0.32, E.outBack);
    const luz = av(u, t0 + 0.1, 0.12);
    mi.el.style.opacity = (clamp(a * 2) * (1 - sale)).toFixed(3);
    mi.el.style.transform = `translate(${(-mi.cx * sale * 0.9).toFixed(1)}px,${(-mi.cy * sale * 0.9).toFixed(1)}px) scale(${(lerp(0.3, 1, a) * lerp(1, 0.4, sale)).toFixed(3)})`;
    mi.g.style.stroke = mezclaColor("#6B6B75", "#FF8B3D", luz);
    mi.el.style.boxShadow = `0 0 ${(20 + 50 * golpe(u, t0 + 0.1, 0.5)).toFixed(0)}px rgba(255,139,61,${(0.15 + 0.5 * golpe(u, t0 + 0.1, 0.5)).toFixed(2)})`;
  });
  const cero = av(t, momento("diecisiete", "Cero") - 0.05, 0.3, E.outExpo);
  const cm = $("#ceroManual");
  cm.style.opacity = (cero * (1 - sale)).toFixed(3);
  cm.style.transform = `scale(${lerp(1.5, 1, cero).toFixed(3)})`;
  cm.style.filter = `blur(${((1 - cero) * 10 + sale * 10).toFixed(1)}px)`;
}

function pintarMarca(t){
  const e = esc.marca, u = t - e.ini, b = capas.botonM;
  const aparece = av(u, 0, 0.4, E.outBack);
  b.svg.style.opacity = clamp(u / 0.1).toFixed(3);
  const late = 1 + 0.025 * Math.sin(u * 3.2) * av(u, 1.2, 0.6);
  b.svg.style.transform = `scale(${(lerp(0.5, 1, aparece) * late).toFixed(3)})`;
  pintarBoton(b, av(u, 0, 0.55, E.inOutCubic), av(u, 0.15, 0.3), av(u, 0.2, 0.55, E.inOutCubic));
  ["#ondaM1", "#ondaM2"].forEach((s, k) => {
    const o = av(u, 0.1 + k * 0.14, 1.0, E.outCubic), el = $(s);
    el.style.top = "605px";
    el.style.borderRadius = "50%";
    el.style.opacity = (u > 0.1 + k * 0.14 ? (1 - o) * 0.6 : 0).toFixed(3);
    el.style.transform = `scale(${lerp(1, 3.8, o).toFixed(3)})`;
  });
  const golpeTexto = (sel, t0) => {
    const a = av(t, t0, 0.28, E.outExpo), el = $(sel);
    el.style.opacity = a.toFixed(3);
    el.style.transform = `scale(${lerp(1.6, 1, a).toFixed(3)})`;
    el.style.filter = `blur(${((1 - a) * 12).toFixed(1)}px)`;
  };
  golpeTexto("#marcaWebs span", Math.max(e.ini + 0.15, momento("marca", "Webs") - 0.06));
  golpeTexto("#marcaCreative span", Math.max(e.ini + 0.3, momento("marca", "Creative") - 0.06));
  const lema = av(t, momento("marca", "Enciende") - 0.05, 0.4);
  $("#marcaLema").style.opacity = lema.toFixed(3);
  $("#marcaLema").style.transform = `translateY(${((1 - lema) * 30).toFixed(1)}px)`;
  const tBoton = momento("marca", "Entra") - 0.1;
  const bt = av(t, tBoton, 0.4, E.outBack);
  $("#marcaBoton").style.opacity = clamp(bt * 1.5).toFixed(3);
  $("#marcaBoton").style.transform = `scale(${(lerp(0.6, 1, bt) * (1 + 0.02 * Math.sin((t - tBoton) * 4) * av(t, tBoton + 0.6, 0.5))).toFixed(3)})`;
  const brillo = ((t - tBoton - 0.5) % 1.8 + 1.8) % 1.8;
  $("#marcaBoton i").style.left = (t > tBoton + 0.5 ? lerp(-160, 620, clamp(brillo / 0.7)) : -200).toFixed(0) + "px";
  const wa = av(t, tBoton + 0.35, 0.4);
  $("#marcaWhats").style.opacity = wa.toFixed(3);
  $("#marcaWhats").style.transform = `translateY(${((1 - wa) * 24).toFixed(1)}px)`;
}

function pintarCabecera(t){
  const primero = esc.nexus, final = esc.diecisiete;
  const op = av(t, primero.ini - 0.1, 0.35) * (1 - av(t, final.ini - 0.1, 0.3));
  $("#cabecera").style.opacity = op.toFixed(3);
  $("#progreso").style.opacity = op.toFixed(3);
  if (op <= 0) return;
  let actual = 0;
  capas.modulos.forEach((c, k) => {
    const e = c.e, d = e.fin - e.ini;
    capas.barras[k].style.width = (100 * clamp((t - e.ini) / d)).toFixed(2) + "%";
    if (t >= e.ini - 0.01) actual = k;
  });
  const c = capas.modulos[actual], salto = actual === 0 ? 1 : av(t, c.e.ini, 0.3, E.outBack);
  const span = $("#contador span");
  span.textContent = String(actual + 1).padStart(2, "0");
  span.style.transform = `translateY(${((1 - salto) * 40).toFixed(1)}px)`;
}

function pintarEfectos(t){
  // destellos
  let d = 0.95 * golpe(t, T.flash, 0.6);
  d += 0.75 * golpe(t, esc.marca.ini, 0.55);
  d += 0.35 * golpe(t, esc.diecisiete.ini, 0.4);
  capas.modulos.forEach(c => { d += 0.10 * golpe(t, c.e.ini + 0.45, 0.35); });
  $("#destello").style.opacity = clamp(d).toFixed(3);
  // raya de luz en cada cambio de módulo
  const cortes = capas.modulos.map(c => c.e.ini).concat([esc.diecisiete.ini]);
  const raya = $("#raya");
  let mostrada = false;
  for (const c of cortes){
    if (t > c - 0.2 && t < c + 0.25){
      const k = av(t, c - 0.2, 0.45, E.inOutCubic);
      raya.style.opacity = (Math.sin(k * Math.PI) * 0.9).toFixed(3);
      raya.style.transform = `translateX(${lerp(-500, 1400, k).toFixed(0)}px) rotate(14deg)`;
      mostrada = true;
      break;
    }
  }
  if (!mostrada) raya.style.opacity = "0";
  // temblor de cámara en los golpes
  const temblor = 20 * golpe(t, T.flash, 0.4) + 10 * golpe(t, esc.marca.ini + 0.05, 0.35);
  const r = azar(Math.floor(t * 60));
  escenario.style.transform = temblor > 0.3
    ? `translate(${((r() - .5) * temblor).toFixed(1)}px,${((r() - .5) * temblor).toFixed(1)}px)` : "";
  // grano
  const g = azar(Math.floor(t * 30) + 7);
  $("#grano").style.transform = `translate(${Math.floor(g() * 128)}px,${Math.floor(g() * 128)}px)`;
}

function pintar(t){
  const luz = av(t, T.flash - 0.02, 0.5);
  pintarFondo(t, luz);
  for (const id of ["gancho", "encender", "diecisiete", "marca"]) vis($("#" + id), visible(id, t));
  if (visible("gancho", t)) pintarGancho(t);
  if (visible("encender", t)) pintarEncender(t);
  capas.modulos.forEach(c => {
    const si = visible(c.m.id, t);
    vis(c.el, si);
    if (si) pintarModulo(c, t);
  });
  if (visible("diecisiete", t)) pintarDiecisiete(t);
  if (visible("marca", t)) pintarMarca(t);
  pintarCabecera(t);
  pintarEfectos(t);
}

async function preparar(){
  montarFondo();
  montarGancho();
  montarEncender();
  montarModulos();
  montarDiecisiete();
  montarMarca();
  montarCabecera();
  await document.fonts.load('900 100px "WC Display"');
  await document.fonts.load('800 100px "WC Display"');
  await document.fonts.load('600 100px "WC Display"');
  await document.fonts.load('500 30px "WC Mono"');
  await document.fonts.load('700 30px "WC Mono"');
  await document.fonts.ready;
  ajustarNombres();
  pintar(0);
}

window.pintar = pintar;
window.listo = preparar();

/* ================= vista previa en el navegador ================= */

if (!window.__GRABANDO__){
  const encaja = () => {
    const k = Math.min(innerWidth / 1080, innerHeight / 1920);
    const m = $("#marco");
    m.style.transform = `scale(${k})`;
    m.style.marginLeft = ((innerWidth - 1080 * k) / 2) + "px";
  };
  addEventListener("resize", encaja);
  encaja();
  let t = 0, ultimo = null, enMarcha = true;
  const audio = new Audio("salida/audio.m4a");
  audio.preload = "auto";
  const paso = ahora => {
    if (ultimo !== null && enMarcha) t += (ahora - ultimo) / 1000;
    ultimo = ahora;
    if (t > T.duracion) { t = 0; if (!audio.paused) audio.currentTime = 0; }
    if (!audio.paused && Math.abs(audio.currentTime - t) > 0.15) t = audio.currentTime;
    pintar(t);
    requestAnimationFrame(paso);
  };
  window.listo.then(() => requestAnimationFrame(paso));
  addEventListener("click", () => {
    if (audio.paused){ audio.currentTime = t; audio.play().catch(() => {}); enMarcha = true; }
    else { audio.pause(); enMarcha = !enMarcha; }
  });
  addEventListener("keydown", ev => {
    if (ev.key === "ArrowRight") t = Math.min(T.duracion, t + 1);
    if (ev.key === "ArrowLeft") t = Math.max(0, t - 1);
    if (ev.key === " ") enMarcha = !enMarcha;
    if (!audio.paused) audio.currentTime = t;
  });
}
</script>
